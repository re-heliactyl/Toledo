# ═════════════════════════════════════════════════════════
#                     Heliactyl Config            
#       This config will work with Heliactyl Next 10
#          or any Toledo based distribution. (310+)        
# ═════════════════════════════════════════════════════════

# ---------------------------------
# Heliactyl Release Information
# ---------------------------------
platform_codename = "Toledo"
platform_level = 335 # channel: development - 24-02-2026 (Toledo)
version = "10.0.0"

# ---------------------------------
# Additional Settings
# ---------------------------------
database = "heliactyl.db"

# ---------------------------------
# Webserver Configuration
# ---------------------------------
[website]
name = "heliactyl" # Website/dashboard name
logo = "https://i.imgur.com/6ykl8tF.png"
port = 17_000 # Default: 25_001
secret = "CHANGE_THIS_SECRET" # Change this - do not run Heliactyl in production with the default secret
domain = "http://localhost:17000"

# ---------------------------------
# Pterodactyl Settings
# ---------------------------------
[pterodactyl]
domain = "https://panel.heliactyl.toledo" # Format: https://panel.domain.tld with no / on the end
key = "" # Find this under Admin -> Application API
client_key = "" # Create an admin account and generate from Account -> API Keys

# ---------------------------------
# API Client Settings
# ---------------------------------
[api.client]
accountSwitcher = true

  # ---------------------------------
  # Stripe
  # ---------------------------------
  [api.client.stripe]
  secret_key = "sk_live_"

  [api.client.discord]
  client_id = ""
  client_secret = "EL2IQYn-Qu"
  bot_token = ".GP589Y."
  server_id = ""
  vpn_bypass_ids = []

  [api.client.resend]
  # ---------------------------------
  # Resend API Key
  #
  # This is required, but no worries as Resend is free.
  # ---------------------------------
  api_key = "re_xxxxxxxx_xxxxxxxxxxxxxxxxxxxxxxxx"
  from = "noreply@example.com"
  app_name = "Heliactyl"

  [api.client.api] # Heliactyl API version 5
  enabled = false
  code = "YOUR_API_KEY"

  [api.client.passwordgenerator]
  signup = true # Disable user signups
  length = 24

  [api.client.allow]
  regen = true # Allow users to regenerate their SFTP/panel password
  overresourcessuspend = false # Suspend users if they go over resource limits

    [api.client.allow.server]
    create = true
    modify = true
    delete = true

  [api.client.packages]
  default = "default" # Default package assigned to users

# ---------------------------------
# Package Configuration
# ---------------------------------
[api.client.packages.list.default]
ram = 2048
disk = 3072
cpu = 100
servers = 2

# ---------------------------------
# Bundle Configuration (Auto Renew, Upgraded Pack, God Pack)
# ---------------------------------
[api.client.bundles]
auto_renew_price = 4.99
upgraded_pack_price = 9.99
god_pack_price = 19.99
god_pack_role_id = "000000000000000000"
subscription_days = 30
mantle_bundle_card = true

# ---------------------------------
# Egg Configuration
# ---------------------------------

# ---------------------------------
# Coin Configuration
# ---------------------------------
[api.client.coins]
enabled = true

    [api.client.coins.transfer]
    enabled = true

    [api.client.coins.store]
    enabled = true

      [api.client.coins.store.ram]
      cost = 600

      [api.client.coins.store.disk]
      cost = 400

      [api.client.coins.store.cpu]
      cost = 500

      [api.client.coins.store.servers]
      cost = 200

    [api.client.coins.boosts]
    enabled = true

# ---------------------------------
# Logging Configuration
# ---------------------------------
[logging]
status = true
webhook = "https://discord.com/api/webhooks/your_webhook_url"

[logging.actions.user]
"Resources Purchased" = true
"payment_success" = true
"server_created" = true
"server_modified" = true
"server_deleted" = true
"auth_login" = true
"auth_register" = true
"auth_discord" = true
"afk_connect" = true
"afk_disconnect" = true
"ticket_created" = true
"ticket_reply" = true

[logging.actions.admin]
"config updated" = true
"config restored" = true
"backup deleted" = true
"dashboard reboot" = true
"panel rebuilt" = true
"panel rebuild failed" = true
"radar node added" = true
"radar node updated" = true
"radar node deleted" = true
"coins updated" = true
"resources updated" = true
"user banned" = true
"user unbanned" = true
"sftp config updated" = true

# ---------------------------------
# Billing & Invoice Configuration
# ---------------------------------
[billing]
vat_rate = 20.0 # TVA rate in percentage (default: 20% France)

  [billing.seller]
  business_name = "Your Business Name"
  phone = "+33 X XX XX XX XX"
  address = "Your Address"
  country = "France"
  postal_code = "XXXXX"
  city = "Your City"
  vat_number = "FRXX XXXXXXXXXX"
  siret_number = "XXX XXX XXX XXXXX"

# ---------------------------------
# Renewal Configuration
# ---------------------------------
[renewal]
enabled = true
renewal_period_days = 2
renewal_window_hours = 24
check_interval_minutes = 5
auto_delete_enabled = true
auto_delete_after_days = 7
api_delay_ms = 1000

# ---------------------------------
# Cloudflare DNS (Subdomains)
# ---------------------------------
[cloudflare]
api_token = ""
max_subdomains_per_server = 2

[[cloudflare.domains]]
enabled = true
name = "main"
domain = "example.com"
zone_id = "your-cloudflare-zone-id"
is_default = true
